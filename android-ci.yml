name: Phantom X build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finds the folder that contains settings.gradle.kts.
      # Works if the project is in the repository root, inside a sub-folder,
      # or was uploaded as a .zip file (it is unpacked automatically).
      - name: Locate project
        id: project
        run: |
          find_settings() {
            find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' \
              | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-
          }
          settings="$(find_settings)"
          if [ -z "$settings" ]; then
            while IFS= read -r archive; do
              if unzip -l "$archive" | grep -q 'settings\.gradle\.kts'; then
                echo "Unpacking $archive"
                unzip -q -o "$archive" -d _project
                break
              fi
            done < <(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*')
            settings="$(find_settings)"
          fi
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts was not found, so the project files are missing from the repository."
            echo "Files found in the repository:"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -n 100
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          PHANTOM_EMAIL: ${{ secrets.PHANTOM_EMAIL }}
          PHANTOM_PASSWORD: ${{ secrets.PHANTOM_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: project
        run: |
          find_settings() {
            find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' \
              | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-
          }
          settings="$(find_settings)"
          if [ -z "$settings" ]; then
            while IFS= read -r archive; do
              if unzip -l "$archive" | grep -q 'settings\.gradle\.kts'; then
                echo "Unpacking $archive"
                unzip -q -o "$archive" -d _project
                break
              fi
            done < <(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*')
            settings="$(find_settings)"
          fi
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts was not found, so the project files are missing from the repository."
            echo "Files found in the repository:"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -n 100
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode signing keystore
        id: signing
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded; the release APK will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No SIGNING_KEYSTORE_BASE64 secret; the release APK will be unsigned."
          fi

      - name: Assemble release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          PHANTOM_EMAIL: ${{ secrets.PHANTOM_EMAIL }}
          PHANTOM_PASSWORD: ${{ secrets.PHANTOM_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Remove the decoded keystore
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        run: rm -f release-keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
